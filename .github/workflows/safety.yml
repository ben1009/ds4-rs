permissions:
  contents: read
on:
  push:
    branches: [main, master]
  pull_request:
name: Safety
jobs:
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Install nightly
        uses: dtolnay/rust-toolchain@655bc29a221a62ee6edb6a0fa9d9530cf424d31d # nightly
      - run: |
            # to get the symbolizer for debug symbol resolution
            sudo apt install llvm
            # to fix buggy leak analyzer:
            # https://github.com/japaric/rust-san#unrealiable-leaksanitizer
            # Append a dev profile with opt-level=1 so debug symbols survive.
            # (The original `sed -i '/\[features\]/i ...'` was a no-op here
            # because the workspace Cargo.toml has no [features] section.)
            {
              echo ''
              echo '[profile.dev]'
              echo 'opt-level = 1'
            } >> Cargo.toml
            cat Cargo.toml
        name: Enable debug symbols
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: cargo +nightly test -Zsanitizer=address
        # only --lib --tests b/c of https://github.com/rust-lang/rust/issues/53945
        run: cargo +nightly test --lib --tests --all-features --target x86_64-unknown-linux-gnu
        env:
          ASAN_OPTIONS: "detect_odr_violation=0:detect_leaks=0"
          RUSTFLAGS: "-Z sanitizer=address"
      - name: cargo test -Zsanitizer=leak
        if: always()
        run: cargo +nightly test --all-features --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Z sanitizer=leak"
  miri-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ops, quant, model-forward, model-kv, model-weights, model-indexer, model-layer, base]
        include:
          - module: ops
            filter: "ops::"
          - module: quant
            filter: "quant::"
          - module: model-forward
            filter: "model::forward::"
          - module: model-kv
            filter: "model::kv_cache::"
          - module: model-weights
            filter: "model::weights::"
          - module: model-indexer
            filter: "model::indexer::"
          - module: model-layer
            filter: "model::layer::"
          - module: base
            filter: "--skip ops:: --skip quant:: --skip model::"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - run: |
          echo "NIGHTLY=nightly-$(curl -s https://rust-lang.github.io/rustup-components-history/x86_64-unknown-linux-gnu/miri)" >> $GITHUB_ENV
      - name: Install ${{ env.NIGHTLY }}
        uses: dtolnay/rust-toolchain@e12eda571dc9a5ee5d58eecf4738ec291c66f295 # master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: cargo miri test -p ds4-core --lib ${{ matrix.filter }}
        run: timeout 180 cargo +${{ env.NIGHTLY }} miri test -p ds4-core --lib -- ${{ matrix.filter }}
        env:
          MIRIFLAGS: ""
  miri-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - run: |
          echo "NIGHTLY=nightly-$(curl -s https://rust-lang.github.io/rustup-components-history/x86_64-unknown-linux-gnu/miri)" >> $GITHUB_ENV
      - name: Install ${{ env.NIGHTLY }}
        uses: dtolnay/rust-toolchain@e12eda571dc9a5ee5d58eecf4738ec291c66f295 # master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: miri
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: cargo miri test -p ds4-cli
        run: cargo +${{ env.NIGHTLY }} miri test -p ds4-cli --bins
        env:
          MIRIFLAGS: ""
