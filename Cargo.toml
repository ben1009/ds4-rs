[workspace]
resolver = "2"
members = ["crates/ds4-cli", "crates/ds4-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Memory mapping
memmap2 = "0.9"

# Concurrency
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
