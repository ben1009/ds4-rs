# Reference vectors for ds4-core numerical tests.
#
# Each entry's SHA-256 must match the committed file byte-for-byte. CI
# enforces this via `tests/manifest.rs`, so a vector can never change
# silently.
#
# Regenerate with:
#     bash scripts/regen_vectors.sh <op>
# and update the SHA column below via:
#     sha256sum crates/ds4-core/tests/vectors/*.bin
#
# Regeneration is intentionally manual — not in CI — so changes to reference
# vectors always show up as a reviewed diff.

